# Production Configuration
spring.application.name=Myanmar_Railway_Booking_Backend

# Server Configuration
server.port=8080
server.servlet.context-path=/

# --- CHANGED: Added DB_CLOSE_DELAY to preserve the file connection pool ---
spring.datasource.url=jdbc:h2:file:./data/mmr_railway_booking;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=sa

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=false

# --- CHANGED: Added web-allow-others so you can access the UI on Render ---
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Production Logging
logging.level.com.ticket.booking=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=ERROR

# Security
spring.security.user.name=admin
spring.security.user.password={bcrypt}$2a$10$N/ZsF0b1b1b1b1b1b1b1b.1b1b1b1b1b1b1b1b1b1b1b1b1b1b1b1

# Allow circular dependencies
spring.main.allow-circular-references=true

spring.web.cors.allowed-origins=https://vercel.app