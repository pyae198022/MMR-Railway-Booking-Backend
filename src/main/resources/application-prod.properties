# Production Configuration
spring.application.name=Myanmar_Railway_Booking_Backend

# Server Configuration
server.port=8080
server.servlet.context-path=/

# H2 Database (Embedded for single-server deployment)
spring.datasource.url=jdbc:h2:file:./data/mmr_railway_booking
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=sa

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=false

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Production Logging
logging.level.com.ticket.booking=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=ERROR

# Security
spring.security.user.name=admin
spring.security.user.password={bcrypt}$2a$10$N/ZsF0b1b1b1b1b1b1b1b.1b1b1b1b1b1b1b1b1b1b1b1b1b1b1b1

# Allow circular dependencies
spring.main.allow-circular-references=true

