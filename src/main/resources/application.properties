spring.application.name=Myanmar_Railway_Booking_Backend

# Server Configuration (Render automatically overrides this, but keeping it is fine)
server.port=8080

# Allow circular references
spring.main.allow-circular-references=true

# --- CHANGED: H2 File-Based Database Configuration ---
spring.datasource.url=jdbc:h2:file:./data/mmr_railway_booking;DB_CLOSE_DELAY=-1;NON_KEYWORDS=KEY
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=sa

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=true

# --- CHANGED: Enable external access to H2 Console ---
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Logging
logging.level.com.ticket.booking=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG

spring.web.cors.allowed-origins=https://mmr-railway-booking-frontend-9dux.vercel.app
